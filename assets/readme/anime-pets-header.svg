<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex Anime Pets</title>
  <desc id="desc">An animated midnight character-select banner with a moon, shrine-inspired frame, drifting petals, and twinkling stars.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b22"/>
      <stop offset=".48" stop-color="#171334"/>
      <stop offset="1" stop-color="#33182f"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f2" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#f8d98b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff87ae" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3b9ca"/>
      <stop offset=".45" stop-color="#ffe9a7"/>
      <stop offset=".7" stop-color="#fff6db"/>
      <stop offset="1" stop-color="#7fe7ed"/>
    </linearGradient>
    <radialGradient id="moon" cx=".42" cy=".38" r=".68">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset=".55" stop-color="#ffe8a8"/>
      <stop offset="1" stop-color="#f4afbd"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="86" height="66" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#d8fbff" opacity=".34"/>
      <circle cx="59" cy="46" r=".8" fill="#ffe9a7" opacity=".38"/>
      <circle cx="78" cy="9" r=".65" fill="#ffc4dc" opacity=".25"/>
    </pattern>
    <path id="petal" d="M0 0C9-7 16-4 17 3C11 10 5 11 0 0Z"/>
  </defs>

  <g>
    <rect width="1200" height="420" rx="30" fill="url(#night)"/>
    <rect width="1200" height="420" fill="url(#stars)"/>
    <rect x="80" y="388" width="1040" height="1" fill="url(#horizon)" opacity=".7"/>

    <g opacity=".22" fill="none" stroke="#7fe7ed" stroke-width="1.2">
      <path d="M53 290C133 223 211 237 281 297S426 359 505 301"/>
      <path d="M695 301C774 359 919 357 1000 297S1068 223 1147 290"/>
      <path d="M69 311C142 263 206 269 262 318"/>
      <path d="M938 318C994 269 1058 263 1131 311"/>
    </g>

    <g transform="translate(1018 92)" filter="url(#softGlow)">
      <circle r="66" fill="#f7c8d5" opacity=".15">
        <animate attributeName="r" values="62;70;62" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".10;.2;.10" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="49" fill="url(#moon)"/>
      <circle cx="-18" cy="-13" r="8" fill="#dca6b3" opacity=".18"/>
      <circle cx="16" cy="18" r="12" fill="#dca6b3" opacity=".13"/>
    </g>

    <g fill="none" stroke="#d95072" stroke-linecap="round" stroke-linejoin="round">
      <path d="M68 350V75M1132 350V75" stroke-width="8" opacity=".74"/>
      <path d="M42 82H1158L1119 58H81Z" stroke-width="10" opacity=".9"/>
      <path d="M76 108H1124" stroke-width="4" opacity=".58"/>
      <path d="M90 350H1110" stroke="#f1bdce" stroke-width="2" opacity=".28"/>
    </g>

    <g transform="translate(96 82)" fill="none" stroke="#f29ab6" stroke-width="3" opacity=".62">
      <path d="M0 0C43 30 58 71 51 126C49 163 68 196 104 224"/>
      <path d="M8 21C35 15 51 18 70 34M34 83C63 75 81 79 100 96M48 146C78 138 98 145 115 161"/>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <text x="600" y="115" fill="#b6f4f5" font-size="18" letter-spacing="9" opacity=".92">CHOOSE YOUR COMPANION</text>
      <text x="600" y="204" fill="url(#gold)" font-size="60" font-weight="700" letter-spacing="1" filter="url(#tinyGlow)">CODEX ANIME PETS</text>
      <text x="600" y="247" fill="#eee8ff" font-size="18" letter-spacing=".4" opacity=".84">animated characters for the quiet moments between tasks</text>
    </g>

    <g transform="translate(600 294)">
      <path d="M-224 0H-26M26 0H224" stroke="url(#gold)" stroke-width="1.6" opacity=".7"/>
      <path d="M0-16L16 0L0 16L-16 0Z" fill="none" stroke="#ffe6a5" stroke-width="2" filter="url(#tinyGlow)">
        <animateTransform attributeName="transform" type="rotate" values="0;180;360" dur="12s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#fff6d4"/>
    </g>

    <g transform="translate(600 350)">
      <g transform="translate(-137)" fill="#6ee7f2"><circle r="9"/><circle r="15" fill="none" stroke="#6ee7f2" opacity=".25"/></g>
      <g transform="translate(-82)" fill="#9cc8ff"><circle r="9"/><circle r="15" fill="none" stroke="#9cc8ff" opacity=".25"/></g>
      <g transform="translate(-27)" fill="#ffd279"><circle r="9"/><circle r="15" fill="none" stroke="#ffd279" opacity=".25"/></g>
      <g transform="translate(28)" fill="#d3b2ff"><circle r="9"/><circle r="15" fill="none" stroke="#d3b2ff" opacity=".25"/></g>
      <g transform="translate(83)" fill="#c9edf0"><circle r="9"/><circle r="15" fill="none" stroke="#c9edf0" opacity=".25"/></g>
      <g transform="translate(138)" fill="#ff9fc4"><circle r="9"/><circle r="15" fill="none" stroke="#ff9fc4" opacity=".25"/></g>
    </g>

    <g fill="#d9fbff" filter="url(#tinyGlow)">
      <path d="M226 118l4 10 10 4-10 4-4 10-4-10-10-4 10-4z">
        <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M877 85l3 8 8 3-8 3-3 8-3-8-8-3 8-3z">
        <animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <path d="M321 302l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#ffe6a5">
        <animate attributeName="opacity" values=".25;1;.25" dur="4.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#ff9fc4" opacity=".78">
      <g>
        <use href="#petal" transform="translate(168 16) rotate(18)"/>
        <animateTransform attributeName="transform" type="translate" values="0 -30;170 450" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;.75;0" dur="10s" repeatCount="indefinite"/>
      </g>
      <g>
        <use href="#petal" transform="translate(748 -4) rotate(-20) scale(.8)"/>
        <animateTransform attributeName="transform" type="translate" values="0 -45;-120 460" dur="13s" begin="-4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.75;.55;0" dur="13s" begin="-4s" repeatCount="indefinite"/>
      </g>
      <g>
        <use href="#petal" transform="translate(978 10) rotate(42) scale(.65)"/>
        <animateTransform attributeName="transform" type="translate" values="0 -60;-210 450" dur="11s" begin="-7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;.5;0" dur="11s" begin="-7s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <rect x="8" y="8" width="1184" height="404" rx="30" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".75"/>
</svg>
